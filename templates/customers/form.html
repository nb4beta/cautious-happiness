{% extends "base.html" %}
{% block title %}{{ 'Edit' if customer.id else 'New' }} customer{% endblock %}
{% block content %}
<h1>{{ 'Edit' if customer.id else 'New' }} customer</h1>

<form method="post" class="form">
  <label>Name *
    <input type="text" name="name" value="{{ customer.name or '' }}" required>
  </label>
  <label>Contact name
    <input type="text" name="contact_name" value="{{ customer.contact_name or '' }}">
  </label>
  <label>Email
    <input type="email" name="email" value="{{ customer.email or '' }}">
  </label>
  <label>Phone
    <input type="text" name="phone" value="{{ customer.phone or '' }}">
  </label>
  <label>Address
    <textarea name="address" rows="3">{{ customer.address or '' }}</textarea>
  </label>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn" href="{{ url_for('customers_list') }}">Cancel</a>
  </div>
</form>
{% endblock %}
