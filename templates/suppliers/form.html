{% extends "base.html" %}
{% block title %}{{ 'Edit' if supplier.id else 'New' }} supplier{% endblock %}
{% block content %}
<h1>{{ 'Edit' if supplier.id else 'New' }} supplier</h1>

<form method="post" class="form">
  <label>Name *
    <input type="text" name="name" value="{{ supplier.name or '' }}" required>
  </label>
  <label>Contact name
    <input type="text" name="contact_name" value="{{ supplier.contact_name or '' }}">
  </label>
  <label>Email
    <input type="email" name="email" value="{{ supplier.email or '' }}">
  </label>
  <label>Phone
    <input type="text" name="phone" value="{{ supplier.phone or '' }}">
  </label>
  <label>Address
    <textarea name="address" rows="3">{{ supplier.address or '' }}</textarea>
  </label>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn" href="{{ url_for('suppliers_list') }}">Cancel</a>
  </div>
</form>
{% endblock %}
