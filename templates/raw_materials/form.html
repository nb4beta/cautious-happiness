{% extends "base.html" %}
{% block title %}{{ 'Edit' if material.id else 'New' }} raw material{% endblock %}
{% block content %}
<h1>{{ 'Edit' if material.id else 'New' }} raw material</h1>

<form method="post" class="form">
  <label>SKU *
    <input type="text" name="sku" value="{{ material.sku or '' }}" required>
  </label>
  <label>Name *
    <input type="text" name="name" value="{{ material.name or '' }}" required>
  </label>
  <label>Unit * <small>(e.g. kg, L, pieces)</small>
    <input type="text" name="unit" value="{{ material.unit or '' }}" required>
  </label>
  <label>Current stock
    <input type="number" name="current_stock" step="any" value="{{ material.current_stock or 0 }}">
  </label>
  <label>Reorder level
    <input type="number" name="reorder_level" step="any" value="{{ material.reorder_level or 0 }}">
  </label>
  <label>Unit cost
    <input type="number" name="unit_cost" step="0.01" value="{{ material.unit_cost or 0 }}">
  </label>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">Save</button>
    <a class="btn" href="{{ url_for('raw_materials_list') }}">Cancel</a>
  </div>
</form>
{% endblock %}
